<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment Cover Page Generator</title>
<style>
  :root { --brand:#80011f; --bg:#ffffff; --card:#D9E7F8; --text:#000000; --muted:#6b89a4; --line:#58c8ee; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:1000px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:20px; grid-template-columns:1fr 1fr; }
  @media (max-width:800px){ .wrap{ grid-template-columns:1fr; } }
  h1 { grid-column:1/-1; margin:0; font-size:1.5rem; color:var(--brand); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; font-size:.85rem; font-weight:600; margin:14px 0 4px; }
  label:first-child { margin-top:0; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:1rem; }
  input:focus { outline:2px solid var(--brand); border-color:transparent; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  button.alt { margin-top:10px; background:#fffdfd; color:var(--brand); border:2px solid var(--brand); }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:#b00020; font-size:.85rem; margin-top:10px; min-height:1em; }
 
  /* live preview */
  .paper { background:#fff; border:1px solid var(--line); border-radius:4px; padding:28px 18px; font-family:"Times New Roman",Times,serif; text-align:center; font-size:.95rem; }
  .paper p { margin:6px 0; }
  .paper .b { font-weight:bold; }
  .paper .gap { height:14px; }
  .paper .logo { max-width:110px; max-height:110px; margin-bottom:6px; }
  .paper table { width:92%; margin:12px auto 0; border-collapse:collapse; }
  .paper td { border:1px solid #000; width:50%; height:26px; }
  .paper tr:last-child td { height:60px; }
  .sug-wrap { position:relative; }
  .sug-list { position:absolute; left:0; right:0; top:100%; z-index:20; margin-top:2px; background:#fff; border:1px solid var(--line); border-radius:8px; max-height:230px; overflow-y:auto; box-shadow:0 6px 18px rgba(0,0,0,.12); display:none; }
  .sug-item { padding:8px 12px; cursor:pointer; font-size:.95rem; }
  .sug-item small { display:block; color:var(--muted); font-size:.78rem; }
  .sug-item.active, .sug-item:hover { background:#eef0fb; }
  .hint { color:var(--muted); font-size:.8rem; margin:0 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1> BRAC University Assignment Cover Page Generator</h1>
 
  <div class="card">
    <label for="assignmentNo">Assignment No.</label>
    <input id="assignmentNo" placeholder="e.g. 1">
 
    
 
    <div class="row">
      <div>
        <label for="courseId">Course ID</label>
        <input id="courseId" autocomplete="off" placeholder="e.g. CSE110">
      </div>
      <div>
        <label for="section">Section</label>
        <input id="section" placeholder="e.g. 01">
      </div>
    </div>
    <label for="courseTitle">Course Title</label>
    <input id="courseTitle" autocomplete="off" placeholder="e.g. Programming Language I">
 
    <label for="submittedTo">Submitted To</label>
    <input id="submittedTo" autocomplete="off" placeholder="Teacher's name">
    <div class="hint" id="staffStatus" style="margin:4px 0 0"></div>
 
    <label for="submittedBy">Submitted By</label>
    <input id="submittedBy" placeholder="Your full name">
 
    <div class="row">
      <div>
        <label for="studentId">Student ID</label>
        <input id="studentId" placeholder="e.g. 1000012354">
      </div>
      <div>
        <label for="semester">Semester</label>
        <input id="semester" placeholder="e.g. Summer 2026">
      </div>
    </div>
 
    <label for="deadline">Deadline (Date of Submission)</label>
    <input id="deadline" type="date">
 
    <button id="downloadBtn">Download Word (.docx)</button>
    <button id="pdfBtn" class="alt">Download PDF</button>
    <div class="err" id="err"></div>
  </div>
 
  <div class="card">
    <p class="hint">Live preview</p>
    <div class="paper" id="paper">
      <img class="logo" id="pLogo" alt="" style="display:none">
      <p class="b" style="font-size:1.15rem">BRAC UNIVERSITY</p>
      <div class="gap"></div>
      <p>Assignment no. <span data-f="assignmentNo"></span></p>
      <p>Course Title: <span data-f="courseTitle"></span></p>
      <p>Course ID: <span data-f="courseId"></span></p>
      <p>Section: <span data-f="section"></span></p>
      <div class="gap"></div>
      <p class="b">Submitted to:</p>
      <p class="b" data-f="submittedTo"></p>
      <div class="gap"></div>
      <p class="b">Submitted by:</p>
      <p class="b" data-f="submittedBy"></p>
      <p class="b">ID: <span data-f="studentId"></span></p>
      <p>Semester: <span data-f="semester"></span></p>
      <p>Date of Submission: <span id="pDate"></span></p>
      <table><tr><td>Signature</td><td>Remarks</td></tr><tr><td></td><td></td></tr></table>
    </div>
  </div>
</div>

/* Converts the course API response into [[id, title], ...].
   Adjust the field names to match your API. */
function mapCourses(data) {
  // The sections API lists one row per section, so keep each course only once
  const rows = Array.isArray(data) ? data : Object.values(data || {});
  const seen = new Map();
  rows.forEach(r => {
    const id = (r.courseCode || r.code || "").toString().trim();
    const title = (r.courseName || r.title || r.name || "").toString().trim();
    if (id && title && !seen.has(id)) seen.set(id, [id, title]);
  });
  return [...seen.values()].sort((x, y) => x[0].localeCompare(y[0]));
}

function formatDate(v) {
  if (!v) return "";
  const [y, m, d] = v.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" });
}
 
// live preview
function updatePreview() {

  $("pDate").textContent = formatDate($("deadline").value);
}

// ---- custom suggestion dropdown (works on every browser, incl. mobile) ----
function attachSuggest(input, getItems) {
  const wrap = document.createElement("div");
  wrap.className = "sug-wrap";
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  const list = document.createElement("div");
  list.className = "sug-list";
  wrap.appendChild(list);
  let shown = [], active = -1;
 
  const close = () => { list.style.display = "none"; active = -1; };
  const pick = item => { input.value = item.value; if (item.onPick) item.onPick(); close(); updatePreview(); };
  const mark = () => [...list.children].forEach((el, i) => el.classList.toggle("active", i === active));
 
  function render() {
    const q = input.value.trim().toLowerCase();
    if (!q) { close(); return; }
    shown = getItems().filter(it => (it.value + " " + (it.label || "")).toLowerCase().includes(q)).slice(0, 8);
    list.innerHTML = "";
    if (!shown.length) { close(); return; }
    shown.forEach(it => {
      const el = document.createElement("div");
      el.className = "sug-item";
      el.textContent = it.value;
      if (it.label) { const sm = document.createElement("small"); sm.textContent = it.label; el.appendChild(sm); }
      el.addEventListener("pointerdown", e => { e.preventDefault(); pick(it); });
      list.appendChild(el);
    });
    active = -1;
    list.style.display = "block";
  }
 
  input.addEventListener("input", render);
  input.addEventListener("focus", render);
  input.addEventListener("blur", () => setTimeout(close, 120));
  input.addEventListener("keydown", e => {
    if (list.style.display !== "block") return;
    if (e.key === "ArrowDown") { active = Math.min(active + 1, shown.length - 1); mark(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); mark(); e.preventDefault(); }
    else if (e.key === "Enter" && active >= 0) { pick(shown[active]); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
}
// ---- Custom Suggestion Dropdown (Supports scrolling & click-to-open when empty) ----
function attachSuggest(input, getItems, showAllOnEmpty = false) {
  const wrap = document.createElement("div");
  wrap.className = "sug-wrap";
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);

  const list = document.createElement("div");
  list.className = "sug-list";
  wrap.appendChild(list);

  let shown = [], active = -1;

  const close = () => { list.style.display = "none"; active = -1; };
  const pick = item => {
    input.value = item.value;
    if (item.onPick) item.onPick();
    close();
    updatePreview();
    autoFillFaculty();
  };
  const mark = () => [...list.children].forEach((el, i) => el.classList.toggle("active", i === active));

  function render() {
    const q = input.value.trim().toLowerCase();
    const allItems = getItems();

    if (!allItems.length) {
      close();
      return;
    }

    if (!q) {
      if (!showAllOnEmpty) { close(); return; }
      shown = allItems; // Show all available items when empty (e.g. all course sections)
    } else {
      shown = allItems.filter(it => (it.value + " " + (it.label || "")).toLowerCase().includes(q));
    }

    list.innerHTML = "";
    if (!shown.length) { close(); return; }

    shown.forEach(it => {
      const el = document.createElement("div");
      el.className = "sug-item";
      el.textContent = it.display || it.value;
      if (it.label) {
        const sm = document.createElement("small");
        sm.textContent = it.label;
        el.appendChild(sm);
      }
      el.addEventListener("pointerdown", e => { e.preventDefault(); pick(it); });
      list.appendChild(el);
    });

    active = -1;
    list.style.display = "block";
  }

  input.addEventListener("input", render);
  input.addEventListener("focus", render);
  input.addEventListener("click", render);
  input.addEventListener("blur", () => setTimeout(close, 150));
  input.addEventListener("keydown", e => {
    if (list.style.display !== "block") return;
    if (e.key === "ArrowDown") { active = Math.min(active + 1, shown.length - 1); mark(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); mark(); e.preventDefault(); }
    else if (e.key === "Enter" && active >= 0) { pick(shown[active]); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
}

// Helper: Normalize strings for comparison
const cleanCode = str => (str || "").toString().toLowerCase().replace(/[^a-z0-9]/g, "");
const cleanSec  = str => (str || "").toString().trim().replace(/^0+/, "") || "0";

// Fetch sections specifically for the currently entered Course ID
function getAvailableSections() {
  const currentCourse = cleanCode($("courseId").value);
  if (!currentCourse || !SECTIONS_DATA.length) return [];

  const matchedRows = SECTIONS_DATA.filter(r => {
    const code = cleanCode(r.courseCode || r.code || r.course_code);
    return code === currentCourse;
  });

  const secMap = new Map();
  matchedRows.forEach(r => {
    const rawSec = (r.section || r.sectionName || r.sec || "").toString().trim();
    if (!rawSec) return;

    // Standardize to 2 digits if numeric (e.g., "1" -> "01")
    const formattedSec = /^\d+$/.test(rawSec) ? rawSec.padStart(2, "0") : rawSec;

    // Extract faculty info for preview inside the dropdown
    let f = r.faculty || r.faculties || r.facultyName || r.instructor;
    if (Array.isArray(f) && f.length > 0) f = f[0];

    let teacherName = "";
    if (f && typeof f === "object") {
      teacherName = f.staffName || f.name || "";
      if (!teacherName && f.shortName) {
        const found = STAFF.find(s => (s.label || "").toLowerCase() === f.shortName.toLowerCase());
        teacherName = found ? found.value : f.shortName;
      }
    } else if (typeof f === "string") {
      teacherName = f;
    }

    if (teacherName) {
      teacherName = teacherName.replace(/^(mr|ms|mrs|miss)\.?\s+/i, "");
      teacherName = teacherName.trim().replace(/^[A-Z]{2,5}\s*-\s*/, "");
    }

    if (!secMap.has(formattedSec)) {
      secMap.set(formattedSec, {
        value: formattedSec,
        display: `Section ${formattedSec}`,
        label: teacherName ? `Teacher: ${teacherName}` : ""
      });
    }
  });

  // Sort sections in ascending order (01, 02, 03...)
  return Array.from(secMap.values()).sort((a, b) => {
    const numA = parseInt(a.value, 10);
    const numB = parseInt(b.value, 10);
    if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
    return a.value.localeCompare(b.value);
  });
}

/* Auto-capitalize the first letter of each word in the Student Name */
const submittedByInput = $("submittedBy");

submittedByInput.addEventListener("input", () => {
  const input = submittedByInput;
  const cursorStart = input.selectionStart;
  const cursorEnd = input.selectionEnd;
  const original = input.value;

  // Capitalize the first letter at the start of the string or following any whitespace
  const capitalized = original.replace(/(^|\s+)([a-z])/g, (match, space, char) => {
    return space + char.toUpperCase();
  });

  if (capitalized !== original) {
    input.value = capitalized;
    // Restore cursor position so typing in the middle of a word doesn't jump to the end
    input.setSelectionRange(cursorStart, cursorEnd);
  }

  updatePreview();
});
 
let STAFF = [];   // [{value: name, label: designation}]
const staffSeen = new Set();
function addStaff(name, label) {
  name = name.replace(/^(mr|ms|mrs|miss)\.?\s+/i, "");
  name = (name || "").toString().trim().replace(/^[A-Z]{2,5}\s-\s/, "");
  if (!name || name.includes("@") || staffSeen.has(name.toLowerCase())) return;
  staffSeen.add(name.toLowerCase());
  STAFF.push({ value: name, label: label || "" });
  STAFF.sort((a, b) => a.value.localeCompare(b.value));
}

/* Generates semester suggestions for the current year (plus adjacent transitions) */
function getSemesterSuggestions() {
  const currentYear = new Date().getFullYear();
  
  // List of terms: Spring, Summer, Fall of current year, plus adjacent terms for transition periods
  const semesters = [
    `Spring ${currentYear}`,
    `Summer ${currentYear}`,
    `Fall ${currentYear}`,
    `Spring ${currentYear + 1}`,
    `Fall ${currentYear - 1}`
  ];

  return semesters.map(sem => ({
    value: sem,
    display: sem,
    label: sem.includes(String(currentYear)) ? "Current Year" : "Adjacent Year"
  }));
}

// 3. Auto-fill function
function autoFillFaculty() {
  const targetCourse  = cleanCode($("courseId").value);
  const targetSection = cleanSec($("section").value);

  if (!targetCourse || !targetSection || !SECTIONS_DATA.length) return;

  const match = SECTIONS_DATA.find(r => {
    const code = cleanCode(r.courseCode || r.code);
    const sec  = cleanSec(r.section || r.sectionName || r.sec);
    return code === targetCourse && sec === targetSection;
  });

  if (!match) return;

  let f = match.faculty || match.faculties || match.facultyName || match.instructor;
  if (Array.isArray(f) && f.length > 0) f = f[0];

  let facultyName = "";
  if (f && typeof f === "object") {
    facultyName = f.staffName || f.name || "";
    // If only initials/shortName were supplied, lookup in the STAFF array
    if (!facultyName && f.shortName) {
      const found = STAFF.find(s => s.label.toLowerCase() === f.shortName.toLowerCase());
      facultyName = found ? found.value : f.shortName;
    }
  } else if (typeof f === "string") {
    facultyName = f;
  }

  if (facultyName) {
    // Strip titles and department prefixes
    facultyName = facultyName.replace(/^(mr|ms|mrs|miss)\.?\s+/i, "");
    facultyName = facultyName.trim().replace(/^[A-Z]{2,5}\s*-\s*/, "");
      // Convert faculty name to uppercase
  name = name.toUpperCase()
    
    $("submittedTo").value = facultyName;
    updatePreview();
  }
}

async function loadLogo() {
  if (!LOGO_SRC) return null;
  // Embedded base64 logo: decode directly (no network request needed)
  if (LOGO_SRC.startsWith("data:")) {
    const mime = (LOGO_SRC.match(/^data:([^;,]+)/) || [])[1] || "";
    const bin = atob(LOGO_SRC.split(",")[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { data: bytes, type: /jpe?g/i.test(mime) ? "jpg" : "png" };
  }
  // Normal image path/URL
  const res = await fetch(LOGO_SRC);
  const buf = await res.arrayBuffer();
  return { data: buf, type: /\.jpe?g$/i.test(LOGO_SRC) ? "jpg" : "png" };
}
 
async function buildDoc(v) {
  const { Document, Packer, Paragraph, TextRun, ImageRun, Table, TableRow, TableCell,
          AlignmentType, WidthType, BorderStyle, HeightRule } = docx;
 
  const FONT = "Times New Roman";
  const center = (runs, after = 120) => new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after }, children: runs });
  const run = (text, bold = false, size = FONT_PT*2) => new TextRun({ text, bold, font: FONT, size });
  const line = (text, bold = false, size = FONT_PT*2, after = 120) => center([run(text, bold, size)], after);
  const spacer = () => center([run("", false, FONT_PT*2)], 120);
 
  const children = [];
 
  const logo = await loadLogo();
  if (logo) {
    children.push(center([new ImageRun({ data: logo.data, type: logo.type, transformation: { width: LOGO_WIDTH, height: LOGO_HEIGHT } })], 120));
  }
 
  children.push(
    line(UNIVERSITY, true, HEADER_FONT_PT*2, 240),
    line(`Assignment no. ${v.assignmentNo}`),
    line(`Course Title: ${v.courseTitle}`),
    line(`Course ID: ${v.courseId}`),
    line(`Section: ${v.section}`),
    spacer(),
    line("Submitted to:", true),
    line(v.submittedTo, true),
    spacer(),
    line("Submitted by:", true),
    line(v.submittedBy, true),
    line(`ID: ${v.studentId}`, true),
    line(`Semester: ${v.semester}`),
    line(`Date of Submission: ${formatDate(v.deadline)}`, false, FONT_PT*2, 200)
  );
 
  const b = { style: BorderStyle.SINGLE, size: 6, color: "000000" };
  const borders = { top: b, bottom: b, left: b, right: b };
  const colW = 4513;
  const cell = (text, height) => new TableCell({
    width: { size: colW, type: WidthType.DXA },
    borders,
    children: [new Paragraph({ alignment: AlignmentType.CENTER, children: text ? [run(text, false, FONT_PT*2)] : [] })]
  });
 
  children.push(new Table({
    width: { size: colW * 2, type: WidthType.DXA },
    columnWidths: [colW, colW],
    alignment: AlignmentType.CENTER,
    rows: [
      new TableRow({ children: [cell("Signature"), cell("Remarks")] }),
      new TableRow({ height: { value: 1500, rule: HeightRule.ATLEAST }, children: [cell(""), cell("")] })
    ]
  }));
 
  return new Document({
    sections: [{
      properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 1440, bottom: 1440, left: 1440, right: 1440 } } },
      children
    }]
  });
}

function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
 
/* ---------- PDF (A4, 1-inch margins, Times 14pt) ---------- */
function buildPdf(v) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });   // 210 x 297 mm
  const M = 25.4, PW = 210, CW = PW - 2 * M, CX = PW / 2; // 1-inch margins
  const STEP = 10.5;                                         // line step (mm)
  let y = M;
 
  doc.setFontSize(FONT_PT);
  const line = (text, bold = false, gap = STEP) => {
    doc.setFont("times", bold ? "bold" : "normal");
    doc.splitTextToSize(text, CW).forEach(t => {
      y += STEP;                                           // baseline offset for 14pt
      doc.text(t, CX, y, { align: "center" });
      // y += STEP*2;
    });
  };
 
  if (LOGO_SRC) {
    const w = LOGO_WIDTH * 25.4 / 96, h = LOGO_HEIGHT * 25.4 / 96;
    const fmt = /^data:image\/jpe?g/i.test(LOGO_SRC) || /\.jpe?g$/i.test(LOGO_SRC) ? "JPEG" : "PNG";
    doc.addImage(LOGO_SRC, fmt, CX - w / 2, y, w, h);
    y += h + 3;
  }
 
  line(UNIVERSITY, true, STEP + 3);
  line(`Assignment no. ${v.assignmentNo}`);
  line(`Course Title: ${v.courseTitle}`);
  line(`Course ID: ${v.courseId}`);
  line(`Section: ${v.section}`);
  y += STEP;
  line("Submitted to:", true);
  line(v.submittedTo, true);
  y += STEP;
  line("Submitted by:", true);
  line(v.submittedBy, true);
  line(`ID: ${v.studentId}`, true);
  line(`Semester: ${v.semester}`);
  line(`Date of Submission: ${formatDate(v.deadline)}`, false, STEP);
  y += 7.4;
 
  // Signature / Remarks table
  const TW = 159.2, TX = CX - TW / 2, HH = 8, BH = 26.5;
  doc.setLineWidth(0.3);
  doc.rect(TX, y, TW / 2, HH);
  doc.rect(TX + TW / 2, y, TW / 2, HH);
  doc.rect(TX, y + HH, TW / 2, BH);
  doc.rect(TX + TW / 2, y + HH, TW / 2, BH);
  doc.setFont("times", "normal");
  doc.text("Signature", TX + TW / 4, y + 5.5, { align: "center" });
  doc.text("Remarks", TX + 3 * TW / 4, y + 5.5, { align: "center" });
 
  return doc;
}
 
$("downloadBtn").addEventListener("click", async () => {

});
